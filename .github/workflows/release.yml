name: Release

# Pushing a version tag like 1.0.0 builds the program for every supported
# platform and publishes the archives as a GitHub release.
on:
  push:
    tags: ["[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum to key a cache on: the program has no dependencies
      - name: Test
        run: make test
      - name: Build archives
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
