name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum to key a cache on: the program has no dependencies
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        run: make test
      - name: Build for every release platform
        run: make release VERSION=ci

  e2e:
    name: End-to-end (Bitcoin Core in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum to key a cache on: the program has no dependencies
      - name: Mine blocks against real Bitcoin Core nodes
        run: make e2e
